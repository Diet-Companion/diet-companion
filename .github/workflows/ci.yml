# Product CI: build and test every pull request and every push to main (S-DEVOPS-035, stage 1 "PR").
#
# HUMAN-AUTHORED. Only the human edits and merges this file (S-GEN-025, G2).
#
# Runs on `pull_request`, never `pull_request_target`: the PR's code runs with a read-only token and
# no secrets, so a fork or an agent branch can't reach anything. The commands are the root scripts
# AGENTS.md defines, the same ones the Developer's work sandbox runs.
#   unit         npm ci, typecheck, build, unit tests (no database, no network).
#   integration  the same build, then `npm run test:integration` against a throwaway PostgreSQL
#                service. Skipped by npm until the script exists (--if-present).
#                Then `npm run test:api`, the API test layer (tests/api), against the same service.
#   image        PRs only: builds the app image from the PR commit and pushes it to the `pr-builds`
#                Artifact Registry repo, so every commit agents test has a build addressable by digest
#                (S-TESTAB-003, decision 2026-11-25). The PR's code runs only inside `docker build`,
#                before any credential exists in the job; GCP access comes after, through a Workload
#                Identity pool that trusts only this repo's pull_request runs and a service account that
#                can write to `pr-builds` and nothing else. Images are deleted after 14 days.
#
# A PR that changes no code (requirements, architecture, docs, staff config) still runs `unit` and
# `integration`, because both are required checks, but they skip their steps and pass in seconds. The
# `changes` job decides. Any doubt (a push, a failed diff) counts as code, so nothing is skipped by accident.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Does the change touch code?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          if [ "$EVENT" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if ! files=$(git diff --name-only "$BASE...$HEAD"); then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          printf '%s\n' "$files"
          code=false
          if printf '%s\n' "$files" | grep -qE '^(client/|backend/|label-reader/|tests/|package\.json$|package-lock\.json$|tsconfig\.base\.json$|vitest\.config\.ts$|\.github/workflows/ci\.yml$)'; then
            code=true
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  unit:
    needs: changes
    # Runs even if `changes` fails, so a failure can't turn the required check into a skipped pass.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Change detection must have succeeded
        if: needs.changes.result != 'success'
        run: exit 1
      - name: No code changed
        if: needs.changes.result == 'success' && needs.changes.outputs.code != 'true'
        run: echo "This PR changes no code, so the build and unit tests are skipped."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install (from the lockfile)
        if: needs.changes.outputs.code == 'true'
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        if: needs.changes.outputs.code == 'true'
        run: npm run typecheck
      - name: Build
        if: needs.changes.outputs.code == 'true'
        run: npm run build
      - name: Unit tests
        if: needs.changes.outputs.code == 'true'
        run: npm test
      - name: Upload the JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/unit.xml
          retention-days: 14
          if-no-files-found: ignore

  integration:
    needs: changes
    # Runs even if `changes` fails, so a failure can't turn the required check into a skipped pass.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        # postgres:17-alpine, pinned by digest (S-SEC-009).
        image: postgres@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-throwaway   # a disposable service container, not a secret
          POSTGRES_DB: diet_companion_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d diet_companion_test"
          --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgres://ci:ci-only-throwaway@localhost:5432/diet_companion_test
    steps:
      - name: Change detection must have succeeded
        if: needs.changes.result != 'success'
        run: exit 1
      - name: No code changed
        if: needs.changes.result == 'success' && needs.changes.outputs.code != 'true'
        run: echo "This PR changes no code, so the build and integration tests are skipped."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install (from the lockfile)
        if: needs.changes.outputs.code == 'true'
        run: npm ci --no-audit --no-fund
      - name: Build
        if: needs.changes.outputs.code == 'true'
        run: npm run build
      - name: Integration tests (PostgreSQL)
        if: needs.changes.outputs.code == 'true'
        run: npm run test:integration --if-present
      - name: API tests (PostgreSQL, tests/api, S-QA-004)
        if: needs.changes.outputs.code == 'true'
        run: npm run test:api

  image:
    needs: changes
    # PRs from this repo only: a fork's run gets no OIDC token. Not a required check.
    if: >-
      github.event_name == 'pull_request' && needs.changes.outputs.code == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write   # the OIDC token for the PR-builds Workload Identity pool, nothing else
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/pr-builds/diet-companion:pr-${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      # Before any credential: the PR's code runs only here, inside the build's containers.
      - name: Build the image (no credentials yet)
        run: docker build --pull=false -t "$IMAGE" .
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_PR_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PR_BUILDER_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Push the image and record its digest
        env:
          REGION: ${{ vars.GCP_REGION }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker push "$IMAGE"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          echo "Image for PR head ${HEAD_SHA::7}: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "$digest"
