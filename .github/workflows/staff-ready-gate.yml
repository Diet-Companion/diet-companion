# Staff ready-gate check (S-BA-017) and requirement lifecycle check (S-BA-009). No model.
#
# HUMAN-AUTHORED. Only the human edits and merges this file (S-GEN-025, G2).
#
# Runs on every PR, and again when the reviewer App or an operator comments on a PR (a new
# review, a disposition or a waiver can change the result). It posts one commit status,
# `staff/ready-gate`, on the PR head: make that status required in the ruleset to enforce the gate.
# A PR that makes no requirement ready passes once its lifecycle check passes.
#
# Runs from the BASE branch (pull_request_target, issue_comment), so a PR can't change the check
# that gates it. The PR head is checked out only as data (requirements/ and knowledge/, with
# history, so the reviewed commit can be read) and never executed. The only write is the status.
name: staff-ready-gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  issue_comment:
    types: [created, edited]

permissions: {}

env:
  # Pinned staff commit (S-GEN-016).
  STAFF_SHA: STAFF_SHA_PLACEHOLDER
  STAFF_REPO: Diet-Companion/staff
  REVIEWER_BOT_LOGIN: diet-companion-reviewer[bot]
  STATUS_CONTEXT: staff/ready-gate
  PR: ${{ github.event.pull_request.number || github.event.issue.number }}

# The latest event per PR wins; an older run's status would be stale anyway.
concurrency:
  group: >-
    ${{ (github.event_name == 'pull_request_target' || github.event.issue.pull_request)
        && format('staff-ready-gate-{0}', github.event.pull_request.number || github.event.issue.number)
        || format('staff-ready-gate-noop-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  ready-gate:
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
      statuses: write
    steps:
      - name: Check out staff at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.STAFF_REPO }}
          ref: ${{ env.STAFF_SHA }}
          path: staff
          persist-credentials: false

      # Comments re-run the check only when they come from the reviewer App or an operator.
      - name: Resolve the PR (and filter comment events)
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENTER: ${{ github.event.comment.user.login }}
          COMMENTER_TYPE: ${{ github.event.comment.user.type }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = issue_comment ]; then
            if [ "$COMMENTER_TYPE" = Bot ]; then
              [ "$COMMENTER" = "$REVIEWER_BOT_LOGIN" ] || { echo "Comment by another bot; skipping."; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; }
            elif ! python3 staff/harness/contract.py is-operator --operators staff/governance/operators.yml --login "$COMMENTER"; then
              echo "Comment by a non-operator; skipping."; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          read -r head_sha base_sha head_repo state < <(gh api "repos/$REPO/pulls/$PR" \
            --jq '[.head.sha, .base.sha, .head.repo.full_name, .state] | @tsv')
          echo "$head_sha$base_sha" | grep -Eq '^[0-9a-f]{80}$' || { echo "::error::unexpected SHAs"; exit 1; }
          [ "$state" = open ] || { echo "PR is not open; skipping."; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; }
          {
            echo "run=true"
            echo "head_sha=$head_sha"
            echo "base_sha=$base_sha"
            echo "fork=$([ "$head_repo" = "$REPO" ] && echo false || echo true)"
          } >> "$GITHUB_OUTPUT"

      - name: Fork PRs are not gated
        if: steps.pr.outputs.run == 'true' && steps.pr.outputs.fork == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" -f state=failure -f context="$STATUS_CONTEXT" \
            -f description="Fork PRs are not gated; push the branch to this repo" --silent
          exit 1

      - name: Check out the PR base (data)
        if: steps.pr.outputs.run == 'true' && steps.pr.outputs.fork == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.base_sha }}
          path: base
          persist-credentials: false
          sparse-checkout: |
            requirements
            knowledge

      # Full history, so the commit a reviewer result names can be read with git show.
      - name: Check out the PR head (data, never executed)
        if: steps.pr.outputs.run == 'true' && steps.pr.outputs.fork == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            requirements
            knowledge

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.pr.outputs.run == 'true' && steps.pr.outputs.fork == 'false'
        with:
          python-version: "3.12"

      - name: Run the check and post the status
        if: steps.pr.outputs.run == 'true' && steps.pr.outputs.fork == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          python -m pip install -q --no-deps --only-binary ':all:' -r staff/harness/requirements.txt || exit 1
          work="$RUNNER_TEMP/gate"; mkdir -p "$work"
          export STAFF_REASON_FILE="$work/reason"
          python staff/harness/ready_gate.py \
            --repo "$REPO" --pr "$PR" --base-dir base --head-dir head \
            --schema staff/plugins/staff-product/schemas/analyst-output.schema.json \
            --operators staff/governance/operators.yml \
            --reviewer-login "$REVIEWER_BOT_LOGIN" \
            --out "$work/result.json" --summary "$GITHUB_STEP_SUMMARY" --description "$work/description"
          rc=$?
          case "$rc" in
            0) state=success; desc=$(cat "$work/description") ;;
            1) state=failure; desc=$(cat "$work/description") ;;
            *) state=error;   desc="Gate check error: $(cat "$work/reason" 2>/dev/null || echo unknown)" ;;
          esac
          gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" -f state="$state" -f context="$STATUS_CONTEXT" \
            -f description="${desc:0:140}" -f target_url="$RUN_URL" --silent
          echo "status $STATUS_CONTEXT: $state ($desc)"
          exit "$rc"
