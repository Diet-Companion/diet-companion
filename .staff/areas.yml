# Path-to-area map (S-GEN-060). Human-only file (S-GEN-025).
areas:
  catalog:        # products (nutrients, shop), label photos, online lookup, saved dishes
    paths: [requirements/catalog/**, knowledge/rules/catalog/**, architecture/catalog/**]
  targets:        # daily target ranges for calories, protein and fat
    paths: [requirements/targets/**, knowledge/rules/targets/**, architecture/targets/**]
  journal:        # the five-meal day plan, the actual log, and the comparison with plan and targets
    paths: [requirements/journal/**, knowledge/rules/journal/**, architecture/journal/**]
  measurements:   # weekly body measurements and trends
    paths: [requirements/measurements/**, knowledge/rules/measurements/**, architecture/measurements/**]
  shopping:       # the Saturday plan for the coming week, grouped by shop
    paths: [requirements/shopping/**, knowledge/rules/shopping/**, architecture/shopping/**]
  system:         # cross-area architecture: the stack, hosting, shared components (S-ARCH-013)
    paths: [architecture/system/**, architecture/overview.md]
